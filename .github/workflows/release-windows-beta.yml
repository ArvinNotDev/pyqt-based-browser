name: Publish Windows one-file beta

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    # This workflow runs only for the explicitly versioned release commit.
    if: contains(github.event.head_commit.message, 'release: v0.1.1-beta.1')
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Compile application sources
        shell: pwsh
        run: |
          python -m compileall -q main.py app_paths.py managers proxy torproxy ui
          if ($LASTEXITCODE -ne 0) { throw 'Python source compilation failed.' }

      - name: Build the one-file executable
        shell: pwsh
        run: ./scripts/build-windows-onefile.ps1

      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist/ARMA-Browser.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'The packaged executable is missing.'
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'arma-onefile-smoke'
          $localAppData = Join-Path $smokeRoot 'LocalAppData'
          New-Item -ItemType Directory -Force -Path $smokeRoot, $localAppData | Out-Null
          $env:LOCALAPPDATA = $localAppData

          $process = Start-Process -FilePath $exe -WorkingDirectory $smokeRoot -PassThru
          try {
            Start-Sleep -Seconds 25
            $process.Refresh()
            if ($process.HasExited) {
              throw "ARMA Browser exited during startup (exit code $($process.ExitCode))."
            }

            $profileRoot = Join-Path $localAppData 'ARMA Browser/profile_data'
            if (-not (Test-Path -LiteralPath $profileRoot -PathType Container)) {
              throw 'The packaged app did not create persistent profile data.'
            }
            Write-Output 'One-file executable remained active and created persistent user data.'
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
            }
          }

      - name: Verify assets and publish the new prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.1.1-beta.1'
          $previousTag = 'v0.1.0-beta.1'
          $exe = 'dist/ARMA-Browser.exe'
          $checksum = 'dist/ARMA-Browser.exe.sha256'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Missing EXE asset.' }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw 'Missing SHA-256 asset.' }

          $sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumText = Get-Content -LiteralPath $checksum -Raw
          if ($checksumText -notmatch $sha256) {
            throw 'The SHA-256 sidecar does not match the built executable.'
          }

          # Publish first so a failed build or release creation never removes the
          # only available release. Remove the superseded release and tag afterward.
          gh release create $tag $exe $checksum `
            --target $env:GITHUB_SHA `
            --title 'ARMA Browser v0.1.1-beta.1 — Windows Beta' `
            --notes-file 'docs/RELEASE_NOTES_v0.1.1-beta.1.md' `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

          gh release view $previousTag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $previousTag --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "The new release was published, but cleanup of $previousTag failed."
            }
            Write-Output "Removed superseded release and tag: $previousTag"
          } else {
            Write-Output "No previous release named $previousTag was found; nothing to clean up."
          }
